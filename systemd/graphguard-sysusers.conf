# GraphGuard job users (S5b.5). Installed to /etc/sysusers.d/ by `just job-users-install`.
# No login shell, no home, no other groups: each runs one lakehouse job in a sandbox.
g gg-jobs    -
u gg-builder - "GraphGuard lakehouse-build job" / /usr/sbin/nologin
u gg-trainer - "GraphGuard build-artifacts job" / /usr/sbin/nologin
u gg-reader  - "GraphGuard store-load, sql, notebook jobs" / /usr/sbin/nologin
m gg-builder gg-jobs
m gg-trainer gg-jobs
m gg-reader  gg-jobs
