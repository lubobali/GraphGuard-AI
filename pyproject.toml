[project]
name = "graphguard"
version = "0.1.0"
description = "Money laundering detection with a graph neural network on IBM AMLworld"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.17",
  "mlflow-skinny>=2.19",
  "scikit-learn>=1.6",
  "numpy>=2.0",
  "pandera[polars]>=0.22",
  "xgboost>=2.1",
  "optuna>=4.0",
  "torch>=2.5",
  "torch-geometric>=2.6",
  "pyg-lib>=0.8",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Compiled neighbour-sampling kernels. LinkNeighborLoader refuses to run
# without them, and they are only published on PyG's own index.
pyg-lib = { index = "pyg" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.13.0+cpu.html"
format = "flat"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphguard"]

# ---------------------------------------------------------------------------
# pytest — strict from day one.
# A typo'd marker fails at collection instead of silently skipping the test.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
filterwarnings = [
  # join_asof with `by` cannot verify sortedness; the frames are sorted
  # explicitly immediately before the join. Informational, not a defect.
  "ignore:Sortedness of columns cannot be checked:UserWarning",
  # pandera 0.22 calls pl.concat(how="horizontal"), deprecated in polars
  # 1.42.1. Third-party; nothing to fix on our side. Remove this line when
  # pandera updates, and let the suite tell us it is stale.
  "ignore:the default behavior of `how='horizontal'` for `concat`:DeprecationWarning",
]
markers = [
  # category — exactly one per test
  "unit: fast, no I/O, no network",
  "db: needs a database",
  "gpu: needs a GPU",
  "slow: deselected by default",
  # orthogonal labels — combine freely with a category
  "integration: crosses a component boundary",
  "regression: locks in a previously fixed bug",
]

# ---------------------------------------------------------------------------
# ruff — complexity caps set to a ceiling that passes today, tightened later.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "PLR0912", "PLR0915", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
