[project]
name = "graphguard"
version = "0.1.0"
description = "Money laundering detection on IBM AMLworld: XGBoost in production, a GNN as the research arm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.17",
  "mlflow-skinny==3.17.2",  # = the server (docker/mlflow-requirements.txt), S5b.7
  "scikit-learn>=1.6",
  "numpy>=2.0",
  "pandera[polars]>=0.22",
  "xgboost>=2.1",
  "optuna>=4.0",
  "redis>=5.2",
  "ray[serve]>=2.40",
  # Ray Serve 2.58 imports jinja2 in its HAProxy manager without declaring it.
  # Locally this was masked: torch requires jinja2, so it was always present.
  # Moving torch to the gnn extra removed it from the base set and the
  # container crash-looped on import. Declared explicitly rather than relying
  # on another package happening to pull it.
  "jinja2>=3.1",
  # S5.7: the scorer downloads its model from S3 at startup (graphguard.serving.model_store).
  "boto3>=1.40",
  "confluent-kafka>=2.15",
  "psycopg2-binary>=2.9.13",
]

[project.optional-dependencies]
# The GNN is the research arm, not the served model (PLAN.md R-1). Keeping
# torch out of the base dependency set keeps roughly 1.2GB of it out of the
# serving container, which ships only what it actually runs.
gnn = [
  "torch>=2.5",
  "torch-geometric>=2.6",
  "pyg-lib>=0.8",
]
dev = [
  "moto[s3,server]>=5.0",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "pyyaml>=6.0",  # config tests read docker-compose.yml and the Dex config
  "cryptography>=42",  # the forged-token test signs a JWT with its own key
  "ruff>=0.8",
]
lakehouse = [
    "duckdb>=1.4",
    "openlineage-python>=1.55,<1.56",  # lineage events (S5.6e)
    "pyiceberg[pyarrow,pyiceberg-core,sql-postgres]>=0.12",
]
notebooks = [
    "marimo>=0.25.2,<0.26",
]
agent = [
    "mcp>=2.3,<2.4",
]

[tool.uv]
# S5b.2: no package version younger than 14 days is ever resolved (the 2025-2026
# npm/PyPI worms were caught within days). Security releases are exempted per
# package in exclude-newer-package, each with its reason.
exclude-newer = "P14D"
# Supply chain: no dependency version younger than ~2 weeks without a reason.
# httpx2/httpcore2 2.16.1-2.16.2 were uploaded 2026-11-16, two days before
# OpenLineage pulled them in (S5.6e); 2.16.0 is from 2026-10-21.
constraint-dependencies = [
  "httpx2<2.16.1",
  "httpcore2<2.16.1",
  # marimo's, same rule (S5.6e): 0.0.34 is no security release (none cited).
  "loro<1.18.0",
  "python-multipart<0.0.34",
  "markdown<3.11.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Compiled neighbour-sampling kernels. LinkNeighborLoader refuses to run
# without them, and they are only published on PyG's own index.
pyg-lib = { index = "pyg" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.13.0+cpu.html"
format = "flat"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphguard"]

# ---------------------------------------------------------------------------
# pytest — strict from day one.
# A typo'd marker fails at collection instead of silently skipping the test.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
filterwarnings = [
  # join_asof with `by` cannot verify sortedness; the frames are sorted
  # explicitly immediately before the join. Informational, not a defect.
  "ignore:Sortedness of columns cannot be checked:UserWarning",
  # pandera 0.22 calls pl.concat(how="horizontal"), deprecated in polars
  # 1.42.1. Third-party; nothing to fix on our side. Remove this line when
  # pandera updates, and let the suite tell us it is stale.
  "ignore:the default behavior of `how='horizontal'` for `concat`:DeprecationWarning",
]
markers = [
  # category — exactly one per test
  "unit: fast, no I/O, no network",
  "db: needs a database",
  "gpu: needs a GPU",
  "slow: deselected by default",
  # orthogonal labels — combine freely with a category
  "integration: crosses a component boundary",
  "regression: locks in a previously fixed bug",
]

# ---------------------------------------------------------------------------
# ruff — complexity caps set to a ceiling that passes today, tightened later.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Explicit, so lint does not depend on .gitignore (a copy without .git would lint
# the whole pinned toolchain under .tools/).
# Only these two: a bare name matches a folder at ANY depth, and "lakehouse" would
# silently skip src/graphguard/lakehouse (the same trap as the S5.6a .gitignore line).
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "PLR0912", "PLR0915", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
