# GraphGuard-AI CI.
#
# CI runs the SAME bootstrap script as the local loop, so both get a pinned,
# identical toolchain: the project's own uv, its own Python, its own just,
# all under .tools/. Nothing is shared with LuBot or with root's environment.
#
# Jobs call `just` recipes rather than repeating flags, so CI and local cannot
# drift apart.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: graphguard
    steps:
      - name: System deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Bootstrap pinned toolchain
        run: ./scripts/bootstrap.sh

      - name: Toolchain is the pinned one
        run: ./.tools/bin/just toolchain

      - name: Lint
        run: ./.tools/bin/just lint

      - name: Format check
        run: ./.tools/bin/just format-check

      - name: Leakage contract guards
        run: ./.tools/bin/just guards

  test:
    runs-on: graphguard
    steps:
      - name: System deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Bootstrap pinned toolchain
        run: ./scripts/bootstrap.sh

      - name: Unit tests
        run: ./.tools/bin/just test
