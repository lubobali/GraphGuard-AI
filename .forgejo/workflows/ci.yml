# GraphGuard-AI CI.
#
# Every job calls a `just` recipe rather than repeating flags, so CI and the
# local loop cannot drift apart. Dependencies come from the committed lockfile
# with --locked, so CI fails loudly if uv.lock and pyproject.toml disagree.
name: ci

on:
  push:
  pull_request:

# A newer push makes an in-flight run pointless. The box is shared with LuBot
# production, so abandoning superseded runs matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: graphguard
    steps:
      - name: System deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Install uv and just
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project from the committed lockfile
        # --locked fails if uv.lock is stale rather than silently re-resolving.
        run: uv sync --extra dev --locked

      - name: Lint
        run: just lint

      - name: Format check
        run: just format-check

  test:
    runs-on: graphguard
    steps:
      - name: System deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Install uv and just
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project from the committed lockfile
        run: uv sync --extra dev --locked

      - name: Unit tests
        # Same recipe the local loop and prek hooks use. One definition.
        run: just test
