# GraphGuard-AI CI.
#
# Jobs run in graphguard/ci (docker/ci.Dockerfile) on their own network with no
# capabilities; the first step proves it (scripts/ci/isolation-probe.sh). S5b.2.
#
# CI runs the SAME bootstrap script as the local loop, so both get a pinned,
# identical toolchain: the project's own uv, its own Python, its own just,
# all under .tools/. Nothing is shared with LuBot or with root's environment.
#
# Jobs call `just` recipes rather than repeating flags, so CI and local cannot
# drift apart.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: graphguard
    timeout-minutes: 15
    steps:
      # Pinned to a commit, not a movable tag (S5b.2). Resolved from data.forgejo.org,
      # where this Forgejo instance fetches actions. Tag v4.4.0 (2026-07-16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Isolation probe
        # No capabilities, own network, no other container reachable, PyPI reachable --
        # or the build fails. git/curl come from the job image, so there is no apt step.
        run: bash scripts/ci/isolation-probe.sh

      - name: Bootstrap pinned toolchain
        run: ./scripts/bootstrap.sh

      - name: Toolchain is the pinned one
        run: ./.tools/bin/just toolchain

      - name: Lint
        run: ./.tools/bin/just lint

      - name: Format check
        run: ./.tools/bin/just format-check

      - name: Leakage contract guards
        run: ./.tools/bin/just guards

  test:
    runs-on: graphguard
    timeout-minutes: 20
    steps:
      # Pinned to a commit, not a movable tag (S5b.2). Resolved from data.forgejo.org,
      # where this Forgejo instance fetches actions. Tag v4.4.0 (2026-07-16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Isolation probe
        # No capabilities, own network, no other container reachable, PyPI reachable --
        # or the build fails. git/curl come from the job image, so there is no apt step.
        run: bash scripts/ci/isolation-probe.sh

      - name: Bootstrap pinned toolchain
        run: ./scripts/bootstrap.sh

      - name: Unit tests
        # CI has no Redis. The Redis-backed store tests are skipped by this
        # explicit flag, with the reason printed -- never by a silent try/except.
        # Everywhere else an unreachable Redis fails them (S5.6a).
        env:
          GRAPHGUARD_SKIP_REDIS_TESTS: "1"
          GRAPHGUARD_SKIP_LAKEKEEPER_TESTS: "1"
        run: ./.tools/bin/just test
