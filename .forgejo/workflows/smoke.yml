# Smoke test — proves the runner chain works end to end, for debugging the runner
# itself without touching the pipeline that guards the code (ci.yml).
#
# S5b.2: same rules as ci.yml -- a pinned checkout, the isolation probe first, and the
# project's own pinned toolchain (scripts/bootstrap.sh) instead of `curl | sh`, which
# ran whatever the internet served that day.
name: smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    # Must be `graphguard` — this repo's own isolated runner.
    # `ubuntu-latest` would queue forever, and must never land on LuBot's runner.
    runs-on: graphguard
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Isolation probe
        run: bash scripts/ci/isolation-probe.sh

      - name: Container identity
        run: |
          echo "os:   $(grep PRETTY_NAME /etc/os-release | cut -d'"' -f2)"
          echo "node: $(node --version)"
          echo "git:  $(git --version)"
          echo "user: $(whoami)"
          echo "commit: $(git rev-parse --short HEAD)"

      - name: Pinned toolchain
        run: |
          ./scripts/bootstrap.sh
          ./.tools/bin/just toolchain

      - name: Resource caps are enforced
        run: |
          LIMIT=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
          echo "cgroup memory.max: $LIMIT (expect 2147483648 = 2G)"
          test "$LIMIT" = 2147483648
