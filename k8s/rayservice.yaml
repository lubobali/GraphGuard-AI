# GraphGuard scoring service on Ray Serve, managed by KubeRay.
#
# Head-only on purpose. A separate worker group would double the Ray overhead
# for no benefit at this request volume, and this box runs LuBot production
# alongside it. Serve replicas run on the head.
#
# The image is imported directly into k3s containerd, so imagePullPolicy must
# be IfNotPresent -- Always would send it looking for a registry that does not
# exist.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: graphguard-scorer
  namespace: graphguard
spec:
  serveConfigV2: |
    applications:
      - name: graphguard
        import_path: graphguard.serving.app:app
        route_prefix: /
        # No runtime_env.working_dir on purpose. /app holds the 1.4GB venv, and
        # Ray would try to package it as the runtime environment on every
        # deploy. The code is installed as a real package in the image
        # (uv sync --no-editable), so the import path resolves without it.
        deployments:
          - name: Scorer
            num_replicas: 2
            ray_actor_options:
              num_cpus: 0.5

  rayClusterConfig:
    rayVersion: "2.58.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "2"
        dashboard-host: "0.0.0.0"
      template:
        metadata:
          annotations:
            # Bumped by `just rotate-redis` (S5b.6): a new value makes KubeRay roll the
            # scorer onto the new Redis password with a zero-downtime upgrade.
            graphguard.ai/redis-secret-rev: "20261119031550"
        spec:
          # S5b.1: the scorer never talks to the Kubernetes API, so it gets no token.
          automountServiceAccountToken: false
          # Pod Security "restricted": the image's own non-root user (Dockerfile
          # USER serve, uid 10001), the runtime's default seccomp profile.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # Ray writes its session, logs and sockets under /tmp/ray; everything
            # else in the image is read-only.
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
          containers:
            - name: ray-head
              image: graphguard/serving:0.1.6
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                # KubeRay launches the head through a login shell, which resets
                # PATH and loses the venv the image put on it. Set explicitly
                # here rather than relying on the image's ENV surviving.
                - name: PATH
                  value: "/app/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
                # The online store lives in Docker, not in k3s. Stateful
                # services stay in Docker with their own volumes; stateless
                # ones run here. 10.42.0.1 is the pod bridge on the host.
                # The URL carries the `scorer` Redis user's password (S5b.1), so it
                # comes from a Secret, never from this file: `just k8s-redis-secret`.
                - name: GRAPHGUARD_REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: graphguard-redis
                      key: url
                # S5.7: the model, by exact version, verified against this hash at
                # startup (refuses to start on any mismatch). Change model = change
                # these two lines (`just model-publish` prints them). Roll back = the
                # previous two. The image carries no model.
                - name: GRAPHGUARD_MODEL_VERSION
                  value: "xgb-ab9ee07e6bd8"
                - name: GRAPHGUARD_MODEL_SHA256
                  value: "dbdce0cd8e0ca2b4d1b0d2b5e264398441ce65afcfdd28224e2f34e8ca8dc014"
                # Read-only key for models/ only, from a Secret: `just k8s-model-secret`.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: graphguard-model, key: AWS_ACCESS_KEY_ID}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: graphguard-model, key: AWS_SECRET_ACCESS_KEY}
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef: {name: graphguard-model, key: AWS_REGION}
              # Sized from measurement, not habit (S5.3, 2026-11-18): 1,920 MiB
              # idle, 1,965 MiB peak over 2,000 requests (cgroup memory.peak).
              # 2.5Gi leaves ~27% headroom; 3Gi was a guess. The request
              # matches real use so the scheduler reserves the truth.
              resources:
                limits:
                  cpu: "2"
                  memory: "2560Mi"
                requests:
                  cpu: "500m"
                  memory: "2Gi"
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 8000
                  name: serve
    workerGroupSpecs: []
