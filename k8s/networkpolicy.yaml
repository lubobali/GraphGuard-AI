# Who may open a connection to GraphGuard's pods (S5.3 / S5.8).
#
# Why: the Ray dashboard (8265) and GCS (6379) accept job submission with no
# authentication -- anyone who reaches them can run code in the pod (the
# "ShadowRay" class). The Hetzner firewall blocks the internet, but every
# Docker container on this box could reach the pod IP, including LuBot's code
# sandboxes. Verified 2026-11-18 from a Docker container: /api/jobs/ answered.
#
# Rule: deny all ingress by default; let KubeRay's operator in (it reads Serve
# status through the dashboard); open only the scoring port 8000 to the rest.
# Egress is denied by default too (S5b.1, below): the scorer may reach only DNS, Redis,
# S3 (networkpolicy-s3.yaml) and Ray-internal ports.
# Enforced by k3s's embedded kube-router network-policy controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: graphguard
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kuberay-operator
  namespace: graphguard
spec:
  podSelector:
    matchLabels:
      ray.io/is-ray-node: "yes"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ray-system
---
# Ray nodes talking to each other. Head-only today, but a worker group added
# later must not be silently cut off from the head.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ray-intra-cluster
  namespace: graphguard
spec:
  podSelector:
    matchLabels:
      ray.io/is-ray-node: "yes"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ray.io/is-ray-node: "yes"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scoring-port
  namespace: graphguard
spec:
  podSelector:
    matchLabels:
      ray.io/node-type: head
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
# Egress (S5b.1): the scorer reaches only what it needs -- DNS, the online store
# (Redis on the host's pod bridge), and other Ray nodes. Everything else (the
# internet, the Kubernetes API, the kubelet, other host ports) times out.
# S3 for the model download is allowed in its own file (networkpolicy-s3.yaml, S5.7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: graphguard
spec:
  podSelector: {}
  policyTypes: ["Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scorer-egress
  namespace: graphguard
spec:
  podSelector:
    matchLabels:
      ray.io/is-ray-node: "yes"
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The pod dials 10.42.0.1:6380, but Docker rewrites that (DNAT) to the Redis
    # container's own address on graphguard-net, port 6379, BEFORE this policy is
    # checked -- so the allowed destination is that one. On graphguard-net only
    # Redis listens on 6379. (Found by the egress test: 10.42.0.1/32:6380 alone
    # blocked Redis.)
    - to:
        - ipBlock:
            cidr: 172.25.0.0/16
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - podSelector:
            matchLabels:
              ray.io/is-ray-node: "yes"
