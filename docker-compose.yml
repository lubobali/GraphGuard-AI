# GraphGuard-AI local services.
#
# ISOLATION CONTRACT. This box runs LuBot production. Every value below is
# chosen so nothing here can reach, collide with, or starve anything else:
#
#   - own compose project name (graphguard), so containers, network and
#     volumes are all namespaced apart from lubot-* and forgejo
#   - own bridge network, not attached to any existing one
#   - own Postgres on 5434; 5432 and 5433 are already taken on this host
#   - MLflow on 5010; 5000 is already taken
#   - every port bound to 127.0.0.1, never 0.0.0.0. Nothing is reachable
#     from the internet
#   - hard memory limits on both services. Swap on this box sits at 100%,
#     so an unbounded container is a production incident
#   - pinned image versions, no :latest

name: graphguard

services:
  mlflow-db:
    image: postgres:16.6-alpine
    container_name: graphguard-mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    networks:
      - graphguard
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER} -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: graphguard/mlflow:2.19.0
    container_name: graphguard-mlflow
    restart: unless-stopped
    depends_on:
      mlflow-db:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "127.0.0.1:5010:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    networks:
      - graphguard
    mem_limit: 1200m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7.4.1-alpine
    container_name: graphguard-redis
    restart: unless-stopped
    # The online feature store. 515,080 accounts at roughly 200 bytes each is
    # about 100MB, so 256MB leaves headroom.
    #
    # noeviction rather than allkeys-lru on purpose: silently evicting an
    # account turns it into a cold account, the model scores it on zeros, and
    # nothing reports that it happened. Failing a write loudly is better than
    # degrading a score quietly.
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      # localhost for host tooling, and the k3s pod bridge so pods can reach it.
      # 10.42.0.1 is cni0, a private bridge: pods on 10.42.0.0/24 can reach it,
      # the internet cannot. That matters here because ufw is inactive on this
      # box, so a 0.0.0.0 bind would be publicly exposed.
      #
      # Coupling worth knowing: cni0 only exists while k3s is running, so this
      # container will fail to start if k3s is down.
      - "127.0.0.1:6380:6379"
      - "10.42.0.1:6380:6379"
    networks:
      - graphguard
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- the lakehouse catalog (S5.6c) ------------------------------------------
  # Lakekeeper: an Iceberg REST catalog, the open-source counterpart of
  # Databricks' Unity Catalog. Its state lives in its own `lakekeeper` database
  # in mlflow-db (own user, refused on mlflow and lakehouse). Since S5.6d every
  # request needs a Dex token and OpenFGA decides what it may do; it still binds
  # 127.0.0.1 only and lives on graphguard-net alone (defence in depth). Credentials (DB URL, encryption key) come from
  # .secrets/lakekeeper.env, never from this file. Hardened like
  # lubot-prod-backend: non-root, read-only root, no capabilities.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    container_name: graphguard-lakekeeper-migrate
    command: ["migrate"]
    restart: "no"
    env_file:
      - .secrets/lakekeeper.env
      - .secrets/lakekeeper-authz.env
    environment:
      # migrate also installs Lakekeeper's authorization model in OpenFGA
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://graphguard-openfga:8081
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    networks:
      - graphguard
    depends_on:
      mlflow-db:
        condition: service_healthy
      openfga:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    container_name: graphguard-lakekeeper
    command: ["serve"]
    restart: unless-stopped
    env_file:
      - .secrets/lakekeeper.env
      - .secrets/lakekeeper-authz.env
    environment:
      # S5.6d: every request needs a Dex token; OpenFGA decides what it may do.
      LAKEKEEPER__BASE_URI: http://127.0.0.1:8181
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://graphguard-openfga:8081
      LAKEKEEPER__OPENID_PROVIDER_URI: http://graphguard-dex:5556/dex
      LAKEKEEPER__OPENID_AUDIENCE: gg-admin,gg-builder,gg-trainer,gg-reader
      LAKEKEEPER__OPENID_SUBJECT_CLAIM: sub
      LAKEKEEPER__UI__ENABLED: "false"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - graphguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      dex:
        condition: service_healthy

  # ---- S5.6d: identities (Dex) and permissions (OpenFGA) -------------------
  # OpenFGA stores Lakekeeper's grants. It has NO host port: only Lakekeeper
  # reaches it, on graphguard-net, with a preshared key. v1.14 is the version
  # Lakekeeper 0.15.1 is tested against.
  openfga-migrate:
    image: openfga/openfga:v1.14.2@sha256:38857bdc425316ebe6dabd1cde52e05c48e6e8bff781713b7c36da8d5ed68205
    container_name: graphguard-openfga-migrate
    command: ["migrate"]
    restart: "no"
    env_file: .secrets/openfga.env
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    networks:
      - graphguard
    depends_on:
      mlflow-db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.14.2@sha256:38857bdc425316ebe6dabd1cde52e05c48e6e8bff781713b7c36da8d5ed68205
    container_name: graphguard-openfga
    command: ["run"]
    restart: unless-stopped
    env_file: .secrets/openfga.env
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_METRICS_ENABLED: "false"
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: "10"
      OPENFGA_DATASTORE_MAX_IDLE_CONNS: "2"
      OPENFGA_LOG_FORMAT: json
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    networks:
      - graphguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  # Dex issues the jobs' identities (OAuth2 client credentials). 127.0.0.1 only:
  # jobs on the host fetch tokens from it; Lakekeeper reaches it by name.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    container_name: graphguard-dex
    command: ["dex", "serve", "/etc/dex/graphguard.yaml"]
    restart: unless-stopped
    env_file: .secrets/dex.env
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/graphguard.yaml:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    ports:
      - "127.0.0.1:5556:5556"
    networks:
      - graphguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5558/healthz/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mlflow-db:
        condition: service_healthy

networks:
  graphguard:
    name: graphguard-net
    driver: bridge

volumes:
  mlflow-db-data:
    name: graphguard-mlflow-db-data
  mlflow-artifacts:
    name: graphguard-mlflow-artifacts
