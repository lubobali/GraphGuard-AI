# GraphGuard-AI local services.
#
# ISOLATION CONTRACT. This box runs LuBot production. Every value below is
# chosen so nothing here can reach, collide with, or starve anything else:
#
#   - own compose project name (graphguard), so containers, network and
#     volumes are all namespaced apart from lubot-* and forgejo
#   - own bridge network, not attached to any existing one
#   - own Postgres on 5434; 5432 and 5433 are already taken on this host
#   - MLflow on 5010; 5000 is already taken
#   - every port bound to 127.0.0.1, never 0.0.0.0. Nothing is reachable
#     from the internet
#   - hard memory limits on both services. Swap on this box sits at 100%,
#     so an unbounded container is a production incident
#   - pinned image versions, no :latest

name: graphguard

services:
  mlflow-db:
    # 16.16 is the 2026-11-12 security release: newer than the ">= 2 weeks" rule,
    # taken on purpose because it is the security fix (S5b.1). Pinned by digest.
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    container_name: graphguard-mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow
    # Access (S5b.1): each service only its own database, SCRAM passwords, everything
    # else rejected, the superuser only on the local socket. Generated by
    # src/graphguard/ops/pg_access.py (`just pg-access`).
    command: >
      postgres
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c log_connections=on
      -c log_disconnections=on
    user: "70:70"  # the image's postgres user; the data volume is already 70:70
    ports:
      - "127.0.0.1:5434:5432"
      # The k3s pod bridge (S6.6): only the stream consumer pod uses it, and pg_hba lets
      # pods reach exactly one database (`stream`, role stream_app) -- everything else rejected.
      - "10.42.0.1:5434:5432"
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /tmp:size=64m,uid=70,gid=70
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks:
      - graphguard
    # S5b.1: measured peak 98 MiB (catalogs + MLflow); was 512m.
    # 256m until S6.11: at 211 MiB with the stream writing (decisions, shadow, outbox) it
    # was too close for an overnight run of ~1M decisions. Measured, then raised.
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER} -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: graphguard/mlflow:3.17.2
    container_name: graphguard-mlflow
    restart: unless-stopped
    depends_on:
      mlflow-db:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://mlflow_app@mlflow-db:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --workers 1
      --app-name basic-auth
    # S5b.7 (MLflow 3): ONE web worker -- one user; measured 346 MiB with 1, 543 with 2.
    # `postgresql+psycopg2://`: SQLAlchemy 2.1 would otherwise pick the psycopg 3 driver,
    # which the image does not ship (the rehearsal caught it).
    # MLflow's own role (not the superuser), and no password in the command line:
    # libpq reads it from a 600 pgpass file owned by the container's uid (S5b.1).
    # The CSRF key for the login's forms (S5b.7): from .secrets/, never from this file.
    env_file: .secrets/mlflow-server.env
    environment:
      PGPASSFILE: /run/secrets/mlflow-pgpass
      # MLflow 3 starts a background job system (a runner + 6 Huey workers, ~227 MiB
      # each) for GenAI features GraphGuard does not use. Off: 1.0 GiB -> 0.35 GiB.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # The login (S5b.7): users live in their own database; the file holds no secret
      # after first start (graphguard.ops.mlflow_auth).
      MLFLOW_AUTH_CONFIG_PATH: /run/secrets/mlflow-auth.ini
    ports:
      - "127.0.0.1:5010:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
      - ./.secrets/mlflow-pgpass:/run/secrets/mlflow-pgpass:ro
      - ./.secrets/mlflow-auth.ini:/run/secrets/mlflow-auth.ini:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    networks:
      - graphguard
    # S5b.1: measured 426 MiB idle, 486 MiB busy with 2 workers (was 1200m with 4).
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  redis:
    # 7.4.11, not the newer 7.4.12: 7.4.12's only security fix is for cluster mode,
    # which this is not, and it is < 2 weeks old (S5b.1). Pinned by digest.
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    container_name: graphguard-redis
    restart: unless-stopped
    # The online feature store. 515,080 accounts at roughly 200 bytes each is
    # about 100MB. Since S6.3 it also holds the stream's state (24 h send windows,
    # ~936k seen pairs, pending events): ~70MB more, and in-place reloads fragment
    # memory. Measured (S6.3, full ~1M-event replay on a throwaway copy): 224MB of
    # data at peak, 303MiB resident (fragmentation 1.38) -- so 320mb of data under a
    # 448m container cap.
    #
    # noeviction rather than allkeys-lru on purpose: silently evicting an
    # account turns it into a cold account, the model scores it on zeros, and
    # nothing reports that it happened. Failing a write loudly is better than
    # degrading a score quietly.
    #
    # Users (S5b.1): the ACL file is generated by `just redis-secrets` from
    # src/graphguard/serving/redis_acl.py -- one user per client with only the
    # commands it uses, the default user off, nobody allowed scripting or admin.
    # It holds SHA-256 hashes; passwords live in .secrets/redis.env.
    command: >
      redis-server
      --maxmemory 320mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
      --protected-mode yes
      --aclfile /etc/redis/users.acl
    # Not the image's uid 999: on this box that is another app's host user.
    user: "10379:10379"
    volumes:
      - ./.secrets/redis-users.acl:/etc/redis/users.acl:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    ports:
      # localhost for host tooling, and the k3s pod bridge so pods can reach it.
      # 10.42.0.1 is cni0, a private bridge: pods on 10.42.0.0/24 can reach it,
      # the internet cannot. Never 0.0.0.0: every port here is bound to a
      # private address on purpose.
      #
      # Coupling worth knowing: cni0 only exists while k3s is running, so this
      # container will fail to start if k3s is down.
      - "127.0.0.1:6380:6379"
      - "10.42.0.1:6380:6379"
    networks:
      - graphguard
    mem_limit: 448m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Healthy = Redis answers. Without credentials the answer is NOAUTH, which
      # proves the server is up without putting a password in the container config.
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- the lakehouse catalog (S5.6c) ------------------------------------------
  # Lakekeeper: an Iceberg REST catalog, the open-source counterpart of
  # Databricks' Unity Catalog. Its state lives in its own `lakekeeper` database
  # in mlflow-db (own user, refused on mlflow and lakehouse). Since S5.6d every
  # request needs a Dex token and OpenFGA decides what it may do; it still binds
  # 127.0.0.1 only and lives on graphguard-net alone (defence in depth). Credentials (DB URL, encryption key) come from
  # .secrets/lakekeeper.env, never from this file. Hardened like
  # lubot-prod-backend: non-root, read-only root, no capabilities.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    container_name: graphguard-lakekeeper-migrate
    command: ["migrate"]
    restart: "no"
    env_file:
      - .secrets/lakekeeper.env
      - .secrets/lakekeeper-authz.env
    environment:
      # migrate also installs Lakekeeper's authorization model in OpenFGA
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://graphguard-openfga:8081
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    networks:
      - graphguard
    depends_on:
      mlflow-db:
        condition: service_healthy
      openfga:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    container_name: graphguard-lakekeeper
    command: ["serve"]
    restart: unless-stopped
    env_file:
      - .secrets/lakekeeper.env
      - .secrets/lakekeeper-authz.env
    environment:
      # S5.6d: every request needs a Dex token; OpenFGA decides what it may do.
      LAKEKEEPER__BASE_URI: http://127.0.0.1:8181
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://graphguard-openfga:8081
      LAKEKEEPER__OPENID_PROVIDER_URI: http://graphguard-dex:5556/dex
      LAKEKEEPER__OPENID_AUDIENCE: gg-admin,gg-builder,gg-trainer,gg-reader
      LAKEKEEPER__OPENID_SUBJECT_CLAIM: sub
      LAKEKEEPER__UI__ENABLED: "false"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    # S5b.1: measured peak 127 MiB, mostly reclaimable cache (32 MiB private); was 256m.
    mem_limit: 192m
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - graphguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      dex:
        condition: service_healthy

  # ---- S5.6d: identities (Dex) and permissions (OpenFGA) -------------------
  # OpenFGA stores Lakekeeper's grants. It has NO host port: only Lakekeeper
  # reaches it, on graphguard-net, with a preshared key. v1.14 is the version
  # Lakekeeper 0.15.1 is tested against.
  openfga-migrate:
    image: openfga/openfga:v1.14.2@sha256:38857bdc425316ebe6dabd1cde52e05c48e6e8bff781713b7c36da8d5ed68205
    container_name: graphguard-openfga-migrate
    command: ["migrate"]
    restart: "no"
    env_file: .secrets/openfga.env
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    networks:
      - graphguard
    depends_on:
      mlflow-db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.14.2@sha256:38857bdc425316ebe6dabd1cde52e05c48e6e8bff781713b7c36da8d5ed68205
    container_name: graphguard-openfga
    command: ["run"]
    restart: unless-stopped
    env_file: .secrets/openfga.env
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_METRICS_ENABLED: "false"
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: "10"
      OPENFGA_DATASTORE_MAX_IDLE_CONNS: "2"
      OPENFGA_LOG_FORMAT: json
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    networks:
      - graphguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  # Dex issues the jobs' identities (OAuth2 client credentials). 127.0.0.1 only:
  # jobs on the host fetch tokens from it; Lakekeeper reaches it by name.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    container_name: graphguard-dex
    command: ["dex", "serve", "/etc/dex/graphguard.yaml"]
    restart: unless-stopped
    env_file: .secrets/dex.env
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/graphguard.yaml:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    ports:
      - "127.0.0.1:5556:5556"
    networks:
      - graphguard
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5558/healthz/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mlflow-db:
        condition: service_healthy

  # --- the stream (S6.4) --------------------------------------------------------
  # Apache Kafka 4.4.0, one node in KRaft combined mode (no ZooKeeper). Official image,
  # pinned by digest. Config docker/kafka/server.properties (read-only): explicit
  # listeners, SCRAM logins on everything reachable from outside the container, deny by
  # default (ACLs in src/graphguard/stream/kafka_admin.py). Ports: host loopback for the
  # replayer and admin, the k3s pod bridge for the consumer pod -- never 0.0.0.0.
  #
  # KAFKA_OPTS carries a JVM hardening flag; a test keeps it (reason in the private record).
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    container_name: graphguard-kafka
    restart: unless-stopped
    command: ["/opt/kafka/bin/kafka-server-start.sh", "/etc/kafka/server.properties"]
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      KAFKA_OPTS: "-XX:-UseBASE64Intrinsics"
      LOG_DIR: /tmp/kafka-logs
    # Not the image's uid 1000 (a host's first human user gets 1000). 10380 is unused.
    user: "10380:10380"
    volumes:
      - ./docker/kafka/server.properties:/etc/kafka/server.properties:ro
      - ./kafka-data:/var/lib/kafka/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    ports:
      - "127.0.0.1:9092:19092"
      - "10.42.0.1:9094:19094"
    networks:
      - graphguard
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # A TCP check, not a Kafka CLI: each CLI call starts a JVM inside the memory cap.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 19091"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # The investigator demo's read API (S7.6, ADR 0008): reads as demo_reader, one write (a
  # verdict) as demo_writer; never the owner's password, never another database. Private:
  # 127.0.0.1 only (reach it over the ssh tunnel). Same image as the scorer (locally built,
  # pinned in k3s and here by tag); serves the static frontend from ./web/out (S7.7).
  demo-api:
    # Its own tag: API changes do not roll the scorer/consumer pods (which stay on the
    # justfile's IMAGE_TAG). Never rebuild a tag; bump it.
    image: graphguard/serving:0.1.24
    container_name: graphguard-demo-api
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "graphguard.demo.api:app",
              "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-server-header"]
    user: "10001:10001"
    env_file: .secrets/demo-api.env
    environment:
      GRAPHGUARD_DEMO_DB: graphguard-mlflow-db:5432
    volumes:
      # the parent folder: `next build` recreates web/out, which a direct mount would lose
      - ./web:/srv/webroot:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    ports:
      - "127.0.0.1:8130:8000"
    networks:
      - graphguard
    mem_limit: 256m
    depends_on:
      mlflow-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  graphguard:
    name: graphguard-net
    driver: bridge

volumes:
  mlflow-db-data:
    name: graphguard-mlflow-db-data
  mlflow-artifacts:
    name: graphguard-mlflow-artifacts
