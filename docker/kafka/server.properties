# GraphGuard's Kafka broker (S6.4). One node, KRaft combined mode (broker + controller).
# Mounted read-only at /etc/kafka/server.properties; tested by tests/stream/test_kafka_config.py.

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093
controller.listener.names=CONTROLLER

# Listeners: set explicitly -- the image would otherwise derive one that binds every
# interface. CONTROLLER and INTERNAL listen on the container's own loopback only (nothing
# outside the container can reach them). HOST and PODS require a SCRAM login; compose
# publishes them on the host's loopback and on the k3s pod bridge, never the internet.
listeners=CONTROLLER://127.0.0.1:9093,INTERNAL://127.0.0.1:19091,HOST://0.0.0.0:19092,PODS://0.0.0.0:19094
advertised.listeners=INTERNAL://127.0.0.1:19091,HOST://127.0.0.1:9092,PODS://10.42.0.1:9094
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:SASL_PLAINTEXT,PODS:SASL_PLAINTEXT
inter.broker.listener.name=INTERNAL
sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.host.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.pods.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.host.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.pods.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# Deny by default. Only the container-local listeners are anonymous (the broker talking to
# itself), and admin is the setup login. Everyone else gets exactly the ACLs in
# src/graphguard/stream/kafka_admin.py.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:ANONYMOUS;User:admin

# One broker: every internal topic has one replica, or it cannot be created.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
default.replication.factor=1
min.insync.replicas=1
num.partitions=1
auto.create.topics.enable=false
group.initial.rebalance.delay.ms=0

# Storage: small segments so retention can actually delete on small topics.
log.dirs=/var/lib/kafka/data
log.segment.bytes=67108864
log.retention.hours=168
log.retention.check.interval.ms=300000
num.network.threads=2
num.io.threads=4
